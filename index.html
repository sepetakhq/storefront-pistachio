<!--
  Everything between the markers below is written by the server, per tenant and
  per route: backend/internal/seo/render.go replaces the whole block.

  It is deliberately generic and deliberately noindex. One bundle serves every
  tenant, so the brand is not knowable at build time, and the only ways to see
  this default are a dev server without the plugin, a binary with no injector,
  or a build whose markers went missing -- none of which should be indexed.

  Do not delete or rename the markers. The API logs at ERROR on boot when they
  are absent, because a build that lost them would serve noindex to every
  crawler while looking perfectly healthy in a browser.
-->
<!--seo:start-->
<title>Toko</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<!--seo:end-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#2F6B1F">

</head>
